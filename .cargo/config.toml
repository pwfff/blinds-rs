[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]
runner = "espflash flash --monitor --port /dev/cu.usbmodem101"

[unstable]
build-std = ["std", "panic_abort"]

[env]
# Not used by the pio builder.
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.1.2"
